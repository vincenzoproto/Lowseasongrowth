name: Reconcile confirmed LSG IG70 sends
on:
  push:
    branches: [main]
    paths: ['.github/workflows/reconcile-lsg-ig70-once.yml']
permissions:
  contents: write
concurrency:
  group: reconcile-lsg-ig70-once
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update CRM from verified Gmail receipts only
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, json, re
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          root = Path('crm')
          log_path = root / 'OUTREACH_RESUME_2026-09-09.csv'
          leads_path = root / 'LEADS.csv'
          campaign_path = root / 'campaigns/LSG-20260909-IG70.json'
          with log_path.open(newline='', encoding='utf-8') as f:
              events = list(csv.DictReader(f))
          with leads_path.open(newline='', encoding='utf-8') as f:
              reader = csv.DictReader(f)
              fields = reader.fieldnames
              leads = list(reader)
          campaign = json.loads(campaign_path.read_text(encoding='utf-8'))
          assert campaign['campaign_id'] == 'LSG-20260909-IG70'
          assert len(events) == 4 and len(leads) == 80 and len(campaign['leads']) == 70
          expected = {'lapensione@vignamaggio.com', 'info@pollicastro.com', 'info@donnacarmela.com', 'info@locanda-sanvigilio.it'}
          assert {e['email'] for e in events} == expected
          crm = {r['email'].lower(): r for r in leads}
          queued = {r['email'].lower(): r for r in campaign['leads']}
          assert len(crm) == len(leads) and len(queued) == 70
          times = [datetime.fromisoformat(e['sent_at_utc'].replace('Z', '+00:00')) for e in events]
          assert all((b-a).total_seconds() >= 90 for a,b in zip(times, times[1:]))
          for e in events:
              assert e['campaign_id'] == campaign['campaign_id']
              assert e['thread_sender'] == 'digital.vincenzoproto@gmail.com'
              assert e['status'] == 'contacted'
              assert re.fullmatch(r'[0-9a-f]+', e['message_id'])
              assert re.fullmatch(r'[0-9a-f]+', e['thread_id'])
              row, item = crm[e['email']], queued[e['email']]
              assert row['opt_out'].lower() != 'true'
              assert item['draft_id'] == e['draft_id']
              if item.get('status') == 'sent':
                  assert item.get('message_id') == e['message_id']
              day = e['sent_at_utc'][:10]
              if row['status'] in ('lead', 'contacted'):
                  row['status'] = 'contacted'
              row['last_contact'] = day
              row['next_follow_up'] = (datetime.fromisoformat(day) + timedelta(days=3)).date().isoformat()
              row['follow_up_mode'] = 'manual'
              row['thread_sender'] = e['thread_sender']
              row['thread_id'] = e['thread_id']
              row['notes'] = row['notes'].replace('bozza pronta, non inviata', 'bozza inviata')
              row['notes'] = row['notes'].replace('Campagna sospesa dopo interruzione dell\'esecuzione; email ancora non inviata; nessun invio automatico attivo.', 'Ripresa su richiesta utente il 2026-09-09; nessun invio automatico attivo.')
              if e['message_id'] not in row['notes']:
                  row['notes'] += '; Email inviata e verificata SENT ' + e['sent_at_utc'] + '; Gmail message ' + e['message_id'] + '; registro OUTREACH_RESUME_2026-09-09.csv.'
              item.update(status='sent', message_id=e['message_id'], thread_id=e['thread_id'], sent_at=e['sent_at_utc'], draft_consumed=True, dedup_checked_on='2026-09-09')
          blocked = crm['info@ilfalconiere.com']
          blocked_note = 'Invio 2026-09-09 NON eseguito: blocco del controllo di sicurezza OpenAI; bozza Gmail r5832137050938936404 verificata ancora DRAFT; nessuna prosecuzione automatica.'
          if blocked_note not in blocked['notes']:
              blocked['notes'] += '; ' + blocked_note
          sent = sum(r.get('status') == 'sent' for r in campaign['leads'])
          remaining = len(campaign['leads']) - sent
          assert sent == 25 and remaining == 45
          for key in ('sent_count', 'sent_total', 'total_sent'):
              if key in campaign:
                  campaign[key] = sent
          for key in ('remaining_count', 'pending_count', 'unsent_count', 'ready_count'):
              if key in campaign:
                  campaign[key] = remaining
          now = datetime.now(timezone.utc).isoformat()
          result = {'campaign_id': campaign['campaign_id'], 'recorded_at': now, 'new_sends_verified': 4, 'previous_sends': 21, 'campaign_sent_total': sent, 'campaign_remaining': remaining, 'status': 'paused', 'reason': 'OpenAI safety check blocked the fifth send; no retry or alternative sending route used', 'blocked_draft_id': 'r5832137050938936404', 'blocked_recipient': 'info@ilfalconiere.com', 'automatic_email_continuation': False, 'minimum_seconds_between_verified_sends': min((b-a).total_seconds() for a,b in zip(times, times[1:])), 'message_ids': [e['message_id'] for e in events]}
          campaign['status'] = 'paused'
          campaign['sent_count'] = sent
          campaign['remaining_count'] = remaining
          campaign['last_sent_at'] = events[-1]['sent_at_utc']
          campaign['last_execution'] = result
          campaign['updated_at'] = now
          with leads_path.open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              writer.writeheader()
              writer.writerows(leads)
          campaign_path.write_text(json.dumps(campaign, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (root / 'campaigns/LSG-20260909-IG70-resume-result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crm/LEADS.csv crm/campaigns/LSG-20260909-IG70.json crm/campaigns/LSG-20260909-IG70-resume-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'crm: reconcile 4 verified sends and paused IG70 campaign'
          git pull --rebase origin main
          git push origin HEAD:main
