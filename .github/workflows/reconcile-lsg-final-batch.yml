name: Reconcile LSG final batch
on:
  push:
    branches: [main]
    paths:
      - crm/continuation_receipts/*.json
      - .github/workflows/reconcile-lsg-final-batch.yml
permissions:
  contents: write
concurrency:
  group: lsg-final-batch-reconcile
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile verified receipts without sending email
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          from datetime import datetime, timedelta, timezone
          root=Path('crm')
          leads_path=root/'LEADS.csv'
          campaign_path=root/'campaigns/LSG-20260909-IG70.json'
          with leads_path.open(newline='',encoding='utf-8') as f:
              reader=csv.DictReader(f); fields=reader.fieldnames; leads=list(reader)
          campaign=json.loads(campaign_path.read_text(encoding='utf-8'))
          crm={r['email'].lower():r for r in leads}
          queued={r['email'].lower():r for r in campaign['leads']}
          receipts=[]
          for p in sorted((root/'continuation_receipts').glob('*.json')):
              receipts.append(json.loads(p.read_text(encoding='utf-8')))
          for e in receipts:
              email=e['email'].lower()
              if email not in crm or email not in queued: continue
              row,item=crm[email],queued[email]
              if item.get('status')=='sent': continue
              day=e['sent_at_utc'][:10]
              row['status']='contacted'
              row['last_contact']=day
              row['next_follow_up']=(datetime.fromisoformat(day)+timedelta(days=3)).date().isoformat()
              row['follow_up_mode']='manual'
              row['thread_sender']=e['thread_sender']
              row['thread_id']=e['thread_id']
              row['notes']=row['notes'].replace('bozza pronta, non inviata','bozza inviata')
              if e['message_id'] not in row['notes']:
                  row['notes']+='; Invio confermato Gmail SENT '+e['sent_at_utc']+'; message '+e['message_id']+'; receipt '+e['message_id']+'.json.'
              item.update(status='sent',message_id=e['message_id'],thread_id=e['thread_id'],sent_at=e['sent_at_utc'],draft_consumed=True,dedup_checked_on=e['dedup_checked_on'])
          sent=sum(x.get('status')=='sent' for x in campaign['leads'])
          remaining=len(campaign['leads'])-sent
          now=datetime.now(timezone.utc).isoformat()
          campaign['status']='completed' if remaining==0 else 'manual_session'
          campaign['sent_count']=sent
          campaign['remaining_count']=remaining
          campaign['updated_at']=now
          campaign['last_execution']={'campaign_id':campaign['campaign_id'],'recorded_at':now,'campaign_sent_total':sent,'campaign_remaining':remaining,'automatic_email_continuation':False}
          with leads_path.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(leads)
          campaign_path.write_text(json.dumps(campaign,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(sent,remaining)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crm/LEADS.csv crm/campaigns/LSG-20260909-IG70.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'crm: reconcile verified final-batch sends'
          git pull --rebase origin main
          git push origin HEAD:main
