name: Finalize paused LSG continuation
on:
  push:
    branches: [main]
    paths: [.github/workflows/finalize-lsg-continuation.yml]
permissions:
  contents: write
concurrency:
  group: lsg-crm-continuation-reconciliation
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Persist verified totals and safety stop only
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          from datetime import datetime,timezone
          root=Path('crm')
          cp=root/'campaigns/LSG-20260909-IG70.json'
          rp=root/'campaigns/LSG-20260909-IG70-continuation-result.json'
          stop=json.loads((root/'campaigns/LSG-20260909-IG70-continuation-stop.json').read_text())
          campaign=json.loads(cp.read_text())
          result=json.loads(rp.read_text())
          assert result['continuation_sends_verified']==stop['continuation_sends_verified']==17
          sent=[x for x in campaign['leads'] if x.get('status')=='sent']
          assert len(sent)==stop['campaign_sent_total']==42
          assert len(campaign['leads'])-len(sent)==stop['campaign_remaining']==28
          assert len({x['message_id'] for x in sent})==42
          item=next(x for x in campaign['leads'] if x['email']==stop['blocked_recipient'])
          assert item['draft_id']==stop['blocked_draft_id'] and item.get('status')!='sent'
          item['last_send_error']='OpenAI safety check blocked the tool call; draft verified still DRAFT; no email sent.'
          item['send_blocked']=True
          with (root/'LEADS.csv').open(newline='',encoding='utf-8') as f:
              reader=csv.DictReader(f)
              fields=reader.fieldnames
              leads=list(reader)
          row=next(x for x in leads if x['email']==stop['blocked_recipient'])
          note='Invio 2026-09-09 NON eseguito: controllo di sicurezza OpenAI; bozza r7822140613317732775 verificata ancora DRAFT; prosecuzione interrotta, nessun invio automatico attivo.'
          if note not in row['notes']:
              row['notes']+='; '+note
          if row['status']=='lead':
              row['follow_up_mode']='paused'
          now=datetime.now(timezone.utc).isoformat()
          result.update(stop)
          result['recorded_at']=now
          campaign.update(status='paused',pause_reason=stop['reason'],sent_count=42,remaining_count=28,last_execution=result,updated_at=now)
          with (root/'LEADS.csv').open('w',newline='',encoding='utf-8') as f:
              writer=csv.DictWriter(f,fieldnames=fields,lineterminator='\n')
              writer.writeheader()
              writer.writerows(leads)
          cp.write_text(json.dumps(campaign,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          rp.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crm/LEADS.csv crm/campaigns/LSG-20260909-IG70.json crm/campaigns/LSG-20260909-IG70-continuation-result.json
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m 'crm: pause at 42 verified sends and retain 28 unsent drafts'
          git pull --rebase origin main
          git push origin HEAD:main
